[categories]
buckets = ["Groceries", "Dining", "Transport", "Health", "Subscriptions", "Entertainment", "Shopping", "Travel", "Housing"]

# Rules are matched against the normalized transaction description (lowercase, whitespace collapsed).
# A rule can set type, category, or both. First matching rule per field wins.
# Rules saved via the TUI are prepended so they take precedence over these.
#
# Matching modes:
#   pattern = "word"          — substring match (case-insensitive)
#   patterns = ["a", "b"]    — any of these substrings (OR logic)
#   regex = true              — treat pattern/patterns as Go regexp (matched against lowercase description)

# ── Type overrides ────────────────────────────────────────────────────────────

# [[rules]]
# pattern = "Nómina"
# type = "income"

# Regex: match "salary" only at the start
# [[rules]]
# pattern = "^salary"
# regex = true
# type = "income"

# [[rules]]
# pattern = "To Savings"
# type = "transfer"

# [[rules]]
# pattern = "Robo Advisor"
# type = "investment"

# ── Category rules ────────────────────────────────────────────────────────────

# Multiple patterns: any of these → Groceries
# [[rules]]
# patterns = ["mercadona", "lidl", "aldi", "carrefour", "dia"]
# category = "Groceries"

# Regex: delivery apps at start of description → Dining
# [[rules]]
# patterns = ["^glovo", "^uber eats", "^just eat"]
# regex = true
# category = "Dining"

# [[rules]]
# pattern = "Alquiler"
# category = "Housing"
