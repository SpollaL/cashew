version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck       # unchecked errors
    - staticcheck    # comprehensive static analysis (includes unused code checks)
    - govet          # suspicious constructs (shadowed vars, printf mismatches)
    - ineffassign    # assignments whose value is never used
    - misspell       # common English spelling mistakes in comments/strings
  exclusions:
    rules:
      # errcheck is too noisy in tests (e.g. ignoring error from deferred Close)
      - path: _test\.go
        linters:
          - errcheck
