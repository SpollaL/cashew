name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          GOOS=linux   GOARCH=amd64 go build -o dist/cashew-linux-amd64   ./cmd/cashew
          GOOS=darwin  GOARCH=amd64 go build -o dist/cashew-darwin-amd64  ./cmd/cashew
          GOOS=darwin  GOARCH=arm64 go build -o dist/cashew-darwin-arm64  ./cmd/cashew
          GOOS=windows GOARCH=amd64 go build -o dist/cashew-windows-amd64.exe ./cmd/cashew

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
